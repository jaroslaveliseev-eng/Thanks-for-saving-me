<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tanks 3D</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12161c;color:#e8ecf1;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
#ui>*{pointer-events:auto}
.panel{background:rgba(18,22,28,.88);border:1px solid #2c3541;border-radius:10px;padding:14px}
.top{position:relative;z-index:5;flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;background:rgba(10,12,16,.88);border-bottom:1px solid #2c3541}
.top .l{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.top .r{display:flex;justify-content:flex-end;font-size:12px;color:#9fb0c3;text-align:right}
.body{flex:1 1 auto;min-height:0;display:flex}
.nav{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:rgba(10,12,16,.72);border-right:1px solid #2c3541;overflow-y:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tcard{flex:0 0 132px;height:132px;border-radius:10px;border:2px solid #2c3541;background:linear-gradient(#262f3b,#161b22);position:relative;cursor:pointer;display:flex;align-items:flex-end;overflow:hidden}
.tcard img{position:absolute;left:0;top:6px;width:100%;height:90px;object-fit:contain;pointer-events:none}
.tcard .tn{font-size:12px;font-weight:700;padding:4px;text-align:center;width:100%;background:#000a;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard.sel{border-color:#e0892b;box-shadow:0 0 12px #e0892b88}.tcard.prem .tn{color:#ffd24a}
.tier{position:absolute;left:5px;top:4px;font-size:11px;font-weight:800;background:#000a;padding:1px 6px;border-radius:5px;z-index:1}
.pips{letter-spacing:3px;color:#e0892b;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{padding:4px 6px;border-bottom:1px solid #2c3541}.tbl td:last-child{text-align:right;font-weight:700}
.up{color:#4cd987}
.cur{padding:4px 9px;border-radius:14px;background:#222b36;font-weight:600;font-size:14px;white-space:nowrap}
.ib{width:44px;height:44px;padding:0;font-size:22px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#2a3340}
.ib.on{background:#e0892b}
button,.btn{background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.ib.on{background:#e0892b}
button:hover{filter:brightness(1.12)}button.sec{background:#2a3340}button.act{background:#e0892b}button.red{background:#c0392b}button.grn{background:#2e9e5b}button:disabled{opacity:.45;cursor:default}
.play{padding:10px 40px;font-size:20px;font-weight:800;letter-spacing:1px;background:linear-gradient(#f0a03a,#d9771c)!important;border-radius:12px;box-shadow:0 3px 10px #0008}
.main{position:relative;flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px}
.main.hg{pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden}
.main.hg>*{pointer-events:auto}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip .card{flex:0 0 190px}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mode{width:200px;padding:18px 10px;font-size:18px;border-radius:12px}
.left{width:min(420px,100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:#1b222b;border:1px solid #2c3541;border-radius:10px;padding:10px}.card.sel{border-color:#e0892b}
.card h4{margin:0 0 6px}.st{font-size:12px;color:#9fb0c3;line-height:1.5}
input[type=text],input[type=password]{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #2c3541;background:#0f1319;color:#fff;font-size:15px;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.row label{min-width:150px}
.err{color:#ff7b6b;min-height:20px;font-size:14px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#222b36;border:1px solid #3a4656;padding:10px 16px;border-radius:8px;z-index:50;pointer-events:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud *{pointer-events:none}
.hpw{position:absolute;top:10px;width:min(300px,40vw)}.hpw.l{left:10px}.hpw.r{right:10px;text-align:right}
.bar{height:14px;background:#0008;border:1px solid #fff4;border-radius:7px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#35c46a;width:100%}.hpw.r .bar i{background:#e1503f}
#cross{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;font:700 28px/1 Arial;text-shadow:0 1px 3px #000}
#cross:before{content:attr(data-symbol)}
#spread{position:absolute;left:50%;top:50%;width:2px;height:2px;transform:translate(-50%,-50%);pointer-events:none}
.spot{position:absolute;width:5px;height:5px;border-radius:50%;background:#39ff75;box-shadow:0 0 3px #073;transform:translate(-50%,-50%)}
#scope{position:absolute;inset:0;display:none;background:transparent;pointer-events:none}
#scope:before,#scope:after{content:none}
#scope{position:absolute;inset:0;display:none;background:transparent}#scope:before,#scope:after{content:none}
#penHint{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-weight:800;font-size:13px;text-shadow:0 1px 4px #000;white-space:nowrap}#rel{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);min-width:58px;padding:4px 8px;background:#0007;border-radius:6px;color:#fff;text-align:center;font:700 18px/1.1 monospace;text-shadow:0 1px 3px #000}#rel i{display:none}
#mini{position:absolute;left:10px;bottom:10px;width:140px;height:140px;background:#0007;border:1px solid #fff4;border-radius:6px}
#cd{position:absolute;left:0;right:0;top:25%;text-align:center;font-size:72px;font-weight:800;text-shadow:0 2px 12px #000}
#hitfx{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px #f00;opacity:0;transition:opacity .4s}
.dmg{position:absolute;font-weight:800;font-size:26px;text-shadow:0 2px 6px #000;transition:all 1s;color:#ffd24a}
#hint{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);font-size:13px;color:#cfd8e3;text-shadow:0 1px 4px #000;text-align:center}
.tc{position:fixed;display:none;pointer-events:auto!important}
#joy{left:30px;bottom:30px;width:140px;height:140px;border-radius:50%;background:#fff2;border:2px solid #fff5}
#joy i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:#fff6}
#fireB{right:30px;bottom:50px;width:96px;height:96px;border-radius:50%;background:#e0892bcc;border:3px solid #fff7;color:#fff;font-weight:800;display:none;align-items:center;justify-content:center}
#scopeB{right:150px;bottom:40px;width:64px;height:64px;border-radius:50%;background:#2f6fedcc;border:3px solid #fff7;color:#fff;font-weight:800;align-items:center;justify-content:center}
#aimz{right:0;top:0;width:60%;height:100%;display:none}
#exitB{position:absolute;right:10px;top:50px;pointer-events:auto!important;padding:6px 10px;font-size:12px}

.branch-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.branch-tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.branch-card{display:flex;align-items:center;gap:10px;min-width:0}
.branch-card img{width:125px;height:95px;object-fit:contain}
.branch-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.branch-info button{align-self:flex-start}
/* Расходники боя: отдельный верхний слой, чтобы сенсорная зона прицела их не перекрывала. */
#combatItems{position:fixed;z-index:2147483647;right:14px;top:50%;bottom:auto;transform:translateY(-50%);display:none;flex-direction:column;gap:8px;align-items:stretch;width:164px;max-width:42vw;pointer-events:auto!important;touch-action:manipulation;-webkit-touch-callout:none;isolation:isolate;contain:layout style}
#combatItems button{position:relative;z-index:41;display:flex;align-items:center;justify-content:flex-start;gap:5px;width:100%;min-height:44px;padding:9px 10px;background:#283d31;border:1px solid #6b9b72;color:#fff;font-size:12px;line-height:1.2;white-space:normal;touch-action:manipulation;-webkit-user-select:none;user-select:none;pointer-events:auto!important;cursor:pointer;box-shadow:0 2px 8px #0009}
#combatItems button{ -webkit-appearance:none; appearance:none; position:relative; z-index:2147483647; }
#combatItems button:active{filter:brightness(1.35);transform:scale(.97)}
#combatItems kbd{display:inline-flex;flex:0 0 20px;align-items:center;justify-content:center;min-width:20px;height:20px;margin-right:2px;padding:0 4px;border-radius:4px;background:#111a;color:#e9f7e9;border:1px solid #8caf8c;font:700 11px system-ui;pointer-events:none}
#aimz{z-index:2}#joy,#fireB,#scopeB{z-index:10}#exitB{z-index:45}
@media(max-width:650px){.branch-tree{grid-template-columns:1fr}.branch-card img{width:95px;height:82px}.branch-info .st{font-size:11px}.nav{padding:5px;gap:5px}.ib{width:40px;height:40px}
  #combatItems{right:max(8px,env(safe-area-inset-right));top:50%;bottom:auto;transform:translateY(-50%);width:clamp(112px,34vw,148px);max-width:38vw;gap:7px}
  #combatItems button{min-height:42px;padding:7px 6px;font-size:11px;border-radius:8px}
}
@media(max-height:480px) and (orientation:landscape){#combatItems{top:50%;gap:4px;width:clamp(108px,25vw,136px)}#combatItems button{min-height:34px;padding:5px;font-size:10px}#combatItems kbd{height:17px;min-width:17px}}

/* Экран прокачки в стиле технического дерева: тёмная панель, модульные слоты и горизонтальная ветка */
.upgrade-screen{background:radial-gradient(ellipse at 55% 45%,#28323d 0,#1a2029 58%,#151a22 100%);padding:10px 14px;overflow:auto;min-width:0}
.upgrade-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #3b4652;padding:4px 0 12px;margin-bottom:12px}
.upgrade-top h2{font-size:18px;margin:0 auto 0 0}.upgrade-top .sub{color:#9eabb9;font-size:13px}
.upgrade-layout{display:grid;grid-template-columns:minmax(230px,285px) minmax(420px,1fr) minmax(245px,300px);gap:12px;min-height:440px}
.upg-modules,.upg-details{background:#171e27dd;border:1px solid #46515e;padding:12px;border-radius:5px;min-width:0}
.upg-modules h3,.upg-details h3{margin:0 0 10px;font-size:16px}
.module-slot{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center;padding:9px;margin:8px 0;background:linear-gradient(135deg,#252e38,#171e27);border:1px solid #68727c;border-radius:4px}
.module-icon{width:48px;height:48px;display:grid;place-items:center;background:#303b45;border:1px solid #84909b;font-size:25px}
.module-slot b{display:block;font-size:13px}.module-slot small{color:#aab5c0;font-size:11px}.module-slot .pips{font-size:13px;letter-spacing:2px}.module-slot button{grid-column:1/-1;width:100%;padding:7px;background:#b77d18}
.tech-scroll{overflow:auto;padding:8px 4px 14px;background:#11182088;border:1px solid #3d4854;border-radius:5px;min-width:0}
.tech-tree{display:flex;align-items:center;gap:0;min-width:max-content;min-height:320px;padding:12px 8px}
.tech-node{width:118px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px;background:linear-gradient(145deg,#28313a,#151b22);border:2px solid #737d85;border-radius:5px;position:relative;cursor:pointer}
.tech-node.sel{border-color:#e9b52e;box-shadow:0 0 12px #e9b52e55}.tech-node.owned{border-color:#6dba55}.tech-node.locked{opacity:.65}
.tech-node .tier-tag{align-self:flex-start;font-weight:900;color:#fff;font-size:13px}.tech-node img{width:100%;height:76px;object-fit:contain}.tech-node b{font-size:11px;text-align:center;line-height:1.2}.tech-node small{font-size:10px;color:#d8b34d}
.tech-link{width:26px;height:2px;background:#9ba7b0;position:relative;flex:0 0 26px}.tech-link:after{content:'';position:absolute;right:0;top:-4px;border-left:7px solid #9ba7b0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.upg-details .detail-img{width:100%;height:140px;object-fit:contain;background:#10161d;border:1px solid #3c4650}.detail-stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #303a45;font-size:13px}.detail-stat span{color:#aeb9c4}.nation-select{display:flex;gap:6px;overflow-x:auto;padding:5px 0 12px}.nation-select button{white-space:nowrap;padding:7px 10px;font-size:12px}
@media(max-width:950px){.upgrade-layout{grid-template-columns:1fr;}.upg-modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px}.upg-modules h3{grid-column:1/-1}.upg-details{display:grid;grid-template-columns:120px 1fr;gap:10px}.upg-details h3{grid-column:1/-1}.upg-details .detail-img{height:120px}}
@media(max-width:600px){.upgrade-screen{padding:8px}.tech-node{width:104px}.upgrade-top h2{font-size:16px}.upgrade-layout{min-height:0}.upg-details{grid-template-columns:90px 1fr}.upg-details .detail-img{height:95px}}

#perfHud{position:absolute;left:10px;top:58px;display:none;gap:9px;padding:5px 8px;background:#101820bb;border:1px solid #ffffff30;border-radius:6px;color:#eaf3ff;font:700 12px/1.2 monospace;text-shadow:0 1px 2px #000;z-index:12;pointer-events:none}#perfHud span{white-space:nowrap}#captureHud{position:absolute;left:50%;top:12px;transform:translateX(-50%);min-width:180px;text-align:center;padding:7px 12px;background:#101820dd;border:1px solid #d9ad3e;border-radius:8px;font-size:13px;pointer-events:none}.capture-bar{height:7px;background:#ffffff30;border-radius:8px;margin-top:5px;overflow:hidden}.capture-bar i{display:block;height:100%;width:0;background:#e5bd38;transition:width .2s}@media(max-width:600px){#perfHud{top:48px;left:6px;font-size:10px;gap:6px}#captureHud{top:8px;font-size:11px;min-width:150px}}

/* Социальные разделы и сенсорные вкладки наций */
.nation-select{position:relative;z-index:20;pointer-events:auto;touch-action:pan-x;overscroll-behavior-x:contain}
.nation-select button,.branch-tabs button{position:relative;z-index:2147483000;pointer-events:auto!important;touch-action:manipulation;flex:0 0 auto;min-height:42px;cursor:pointer;-webkit-appearance:none;appearance:none}
.branch-tabs{position:relative;z-index:20;pointer-events:auto}

/* Общий чат: корректная высота на мобильных, поле ввода всегда видно */
.main.chat-main{display:flex;flex-direction:column;overflow:hidden;padding:0;min-height:0}
.chat-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;max-width:none;height:auto;overflow:hidden;padding:clamp(6px,1.5vw,14px);background:rgba(18,22,28,.92);border-radius:0;border:none}
.chat-panel h2{flex:0 0 auto;margin:0 0 4px;font-size:clamp(15px,2.4vw,21px)}
.chat-messages{flex:1 1 0;min-height:0;height:auto;max-height:none;margin:6px 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#0d131a;border:1px solid #354252;border-radius:8px;padding:10px}
.chat-line{padding:7px 4px;border-bottom:1px solid #ffffff12;overflow-wrap:anywhere;font-size:14px}.chat-line time{color:#8d9baa;font-size:11px;margin-right:6px}.chat-line b{color:#f0b34d}
.chat-compose{display:flex;flex:0 0 auto;gap:8px;align-items:center;position:relative;z-index:30;padding:6px 0 max(8px,env(safe-area-inset-bottom));background:rgba(18,22,28,.98)}
.chat-compose input{flex:1;min-width:0;margin:0;height:44px;min-height:44px;font-size:16px;touch-action:manipulation;pointer-events:auto;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;border-radius:8px;border:1px solid #3a4654;background:#0f151c;color:#e8ecf1;padding:0 12px}
.chat-compose button{flex:0 0 auto;min-height:44px;white-space:nowrap;touch-action:manipulation;pointer-events:auto}
.chat-panel .st{flex:0 0 auto;font-size:12px;color:#9fb0c3;padding-bottom:env(safe-area-inset-bottom)}
.chat-empty{color:#8d9baa;text-align:center;padding:24px 12px;font-size:14px}
@media(max-width:800px){.chat-panel{padding:7px}.chat-messages{padding:7px}.chat-line{font-size:13px;padding:5px 3px}}
@media(max-height:500px) and (orientation:landscape){
 .top{padding:3px 7px;gap:4px}.body{min-height:0}.nav{padding:4px;gap:4px}
 .chat-panel{padding:4px 8px;gap:2px}.chat-panel h2{font-size:14px;line-height:1.2}
 .chat-messages{margin:3px 0;padding:5px}.chat-line{font-size:12px;padding:3px}.chat-line time{font-size:10px}
 .chat-compose{gap:6px;padding:3px 0 max(4px,env(safe-area-inset-bottom))}
 .chat-compose input{height:38px;min-height:38px;padding:0 9px;margin:0;font-size:16px}
 .chat-compose button{height:38px;min-height:38px;padding:6px 10px;font-size:12px}
 .chat-panel .st{font-size:10px;line-height:1.2}
}
@media(max-width:420px){.chat-compose{gap:5px}.chat-compose button{padding:8px 9px;font-size:12px}}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="hud">
  <div class="hpw l"><span id="hpMeN"></span> <span id="hpMeV"></span><div class="bar"><i id="hpMe"></i></div></div>
  <div class="hpw r"><span id="hpEnN"></span> <span id="hpEnV"></span><div class="bar"><i id="hpEn"></i></div></div>
  <div id="cross"></div><div id="spread"></div><div id="scope"></div><div id="penHint"></div><div id="hitfx"></div>
  <div id="rel"><i id="relI"></i></div>
  <canvas id="mini" width="140" height="140"></canvas>
  <div id="cd"></div>
  <div id="hint"></div><div id="perfHud" aria-live="off"><span id="fpsHud">FPS: --</span><span id="pingHud">PING: --</span><span id="clockHud">--:--:--</span></div><div id="captureHud" style="display:none">ЗАХВАТ ТОЧКИ · <b id="capturePct">0%</b><div class="capture-bar"><i id="captureFill"></i></div></div>
  <button id="exitB" class="sec">Выйти из боя</button>
</div>
<div class="tc" id="joy"><i id="joyK"></i></div>
<div class="tc" id="aimz"></div>
<div class="tc" id="fireB">ОГОНЬ</div>
<div class="tc" id="scopeB">ПРИЦЕЛ</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="game.js"></script>
